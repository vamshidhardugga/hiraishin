[package]
name = "hiraishin"
version = "0.0.0"
edition = "2024"
description = "Redirection engine for a URL shortening service."
repository = "https://github.com/vamshidhardugga/hiraishin"
license = "MIT"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[dependencies]
axum = { version = "0.8.9" }
tokio = { version = "1.53.1", features = [ "full" ] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "json" ] }
